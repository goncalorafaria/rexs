site_name: REXS
site_description: Reproducible Experiments, eXecuted on Slurm
site_url: https://goncalorafaria.github.io/rexs/
repo_url: https://github.com/goncalorafaria/rexs
repo_name: goncalorafaria/rexs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/rexs-mark.svg
  favicon: assets/rexs-mark.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Site configuration: configuration.md
  - Translation model: translation.md
  - Operations and dashboard: operations.md
  - Compatibility: compatibility.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/goncalorafaria

copyright: Copyright &copy; 2026 Goncalo Faria · MIT License
